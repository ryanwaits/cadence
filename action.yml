name: "Cadence"
description: "Render a changelog / announcement video from a GitHub release — no LLM, no external services."
branding:
  icon: "film"
  color: "purple"

inputs:
  repo:
    description: "owner/name to read the release from (defaults to the current repo)"
    required: false
    default: "${{ github.repository }}"
  tag:
    description: "release tag (defaults to the release that triggered the workflow)"
    required: false
    default: "${{ github.event.release.tag_name }}"
  kind:
    description: "the structural arc: changelog | launch | milestone | announcement | showcase"
    required: false
    default: "changelog"
  template:
    description: "DEPRECATED — alias for `kind` (the arc). Use `kind`. Legacy values: changelog-reel | feature-launch | milestone"
    required: false
    default: ""
  format:
    description: "16x9 | 1x1 | 9x16"
    required: false
    default: "16x9"
  install:
    description: "real install command shown in the closer, e.g. 'npm i your-pkg'"
    required: false
    default: ""
  background:
    description: "gradient:#a,#b | solid:#hex | image:file.png"
    required: false
    default: ""
  theme-file:
    description: "path to a theme JSON (from `cadence study ...`) for brand colors"
    required: false
    default: ""
  upload:
    description: "attach the rendered MP4 to the triggering release (needs contents: write)"
    required: false
    default: "false"

outputs:
  video:
    description: "Path to the rendered MP4 in the workspace"
    value: ${{ steps.render.outputs.video }}

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
    - name: Install engine deps
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --frozen-lockfile || bun install
    - name: Render
      id: render
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        args=(--release "${{ inputs.repo }}" --format "${{ inputs.format }}")
        # `template` is the deprecated alias for the arc; when set it wins (back-compat),
        # else use the canonical `kind` input.
        if [ -n "${{ inputs.template }}" ]; then args+=(--template "${{ inputs.template }}"); else args+=(--kind "${{ inputs.kind }}"); fi
        [ -n "${{ inputs.tag }}" ] && args+=(--tag "${{ inputs.tag }}")
        [ -n "${{ inputs.install }}" ] && args+=(--install "${{ inputs.install }}")
        [ -n "${{ inputs.background }}" ] && args+=(--background "${{ inputs.background }}")
        [ -n "${{ inputs.theme-file }}" ] && args+=(--theme-file "${{ inputs.theme-file }}")
        bun run cli create "${args[@]}"
        mp4=$(ls -t out/*.mp4 | head -1)
        cp "$mp4" "$GITHUB_WORKSPACE/cadence.mp4"
        echo "video=$GITHUB_WORKSPACE/cadence.mp4" >> "$GITHUB_OUTPUT"
    - name: Upload to release
      if: ${{ inputs.upload == 'true' && inputs.tag != '' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "${{ inputs.tag }}" cadence.mp4 --clobber --repo "${{ inputs.repo }}"
