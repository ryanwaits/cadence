name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run check:motion
      - run: bun run check:skill
      # check:render is intentionally excluded — its golden pixel hashes are
      # captured locally on macOS and font rasterization differs on linux runners.
